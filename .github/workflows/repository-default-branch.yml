name: Configure Gitee default branch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/repository-default-branch.yml]

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-22.04
    steps:
      - name: Set Gitee default branch to main
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          token = os.environ.get('GITEE_TOKEN')
          if not token:
              print('::error::Missing GITEE_TOKEN repository secret')
              raise SystemExit(1)
          base = 'https://gitee.com/api/v5/repos/maoxiaoquan/my-assistant'
          def api(path='', payload=None):
              headers = {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'}
              request = urllib.request.Request(base + path, headers=headers, method='PATCH' if payload else 'GET', data=json.dumps(payload).encode() if payload else None)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  print('::error::Gitee API ' + (path or '/repository') + ' returned HTTP ' + str(error.code))
                  raise SystemExit(1)
              except urllib.error.URLError:
                  print('::error::Gitee API network connection failed')
                  raise SystemExit(1)
          api('/branches/main')
          repo = api()
          if repo['default_branch'] != 'main':
              api(payload={'name': repo['name'], 'default_branch': 'main'})
          assert api()['default_branch'] == 'main', 'Default branch verification failed'
          print('Gitee default branch is main. Existing branches have been preserved.')
