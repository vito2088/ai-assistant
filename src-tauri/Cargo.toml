[package]
name = "my-assistant"
version = "0.2.1"
description = "A lightweight desktop assistant"
authors = ["my-assistant"]
edition = "2021"

[lib]
name = "my_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "macros", "time", "net", "io-util", "fs", "process"] }
base64 = "0.22"
portable-pty = "0.9"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0.1"
zeroize = "1"
regex = "1"
keyring = { version = "3.6", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust", "vendored"] }

[target."cfg(windows)".dependencies]
windows-capture = "2.0.1"
png = "0.18"
windows-numerics = "0.3"
windows = { version = "0.62", features = ["Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Imaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Controls_Dialogs", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["protocol-asset"] }

[dev-dependencies]
rand = "0.10"

# Keep the image-processing hot path responsive in `tauri dev` too.
[profile.dev.package.my-assistant]
opt-level = 2

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3
