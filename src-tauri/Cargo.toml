[package]
name = "my-assistant"
version = "0.1.1"
description = "A lightweight desktop assistant"
authors = ["my-assistant"]
edition = "2021"

[lib]
name = "my_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "macros", "time"] }
base64 = "0.22"
keyring = { version = "3.6", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust", "vendored"] }

[target."cfg(windows)".dependencies]
windows-capture = "2.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
